name: Explorer pictures

# Pictures of Pairnets in the real File Explorer, taken on GitHub's throwaway Windows computer (tools/ExplorerShots
# changes that computer's Explorer, so it never runs anywhere else). Only for the Explorer work's own branch.
on:
  push:
    branches: [feature/explorer-integration]
    paths:
      - tools/ExplorerShots/**
      - src/Pairnets.Client/Platform/**
      - src/Pairnets.Core/Client/FileStatus.cs
      - src/Pairnets.Core/Sync/**
      - .github/workflows/explorer-pictures.yml

permissions:
  contents: read

concurrency:
  group: explorer-pictures-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  pictures:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Take the pictures
        run: |
          dotnet build tools/ExplorerShots/ExplorerShots.csproj -c Release
          dotnet run --project tools/ExplorerShots/ExplorerShots.csproj -c Release --no-build -- explorer-pictures --i-am-ci

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-pictures
          path: explorer-pictures
