name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  linux:
    name: Build and test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (tree and history)
        run: |
          bash scripts/check-secrets.sh --tree
          bash scripts/check-secrets.sh --history

      - name: Lint shell scripts
        run: shellcheck deploy/*.sh deploy/linux-desktop/*.sh deploy/macos/*.sh scripts/*.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Pairnets.sln

      - name: Build (client included via EnableWindowsTargeting)
        run: dotnet build Pairnets.sln -c Release --no-restore

      - name: Test
        env:
          PAIRNETS_CONVERGENCE_SEEDS: 250
        run: >
          dotnet test Pairnets.sln -c Release --no-build
          --logger "trx;LogFileName=linux.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --blame-hang-timeout 10m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore

  windows:
    name: Build client and test (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Pairnets.sln

      - name: Build
        run: dotnet build Pairnets.sln -c Release --no-restore

      - name: Publish client (single-file smoke test)
        run: >
          dotnet publish src/Pairnets.Client/Pairnets.Client.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish/client

      - name: Render the Windows UI (loads every window, light and dark)
        run: |
          dotnet build tools/RenderScreens.Wpf/RenderScreens.Wpf.csproj -c Release
          dotnet run --project tools/RenderScreens.Wpf/RenderScreens.Wpf.csproj -c Release --no-build -- screens --print

      - name: Upload Windows UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-screenshots
          path: screens

      - name: Test
        env:
          PAIRNETS_CONVERGENCE_SEEDS: 50
        run: >
          dotnet test Pairnets.sln -c Release --no-build
          --logger "trx;LogFileName=windows.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --blame-hang-timeout 10m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore

  macos:
    name: Build desktop app and test (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          dotnet build src/Pairnets.Desktop/Pairnets.Desktop.csproj -c Release
          dotnet build tests/Pairnets.Tests/Pairnets.Tests.csproj -c Release

      - name: Build Pairnets.app (smoke test)
        run: |
          dotnet publish src/Pairnets.Desktop/Pairnets.Desktop.csproj -c Release -r osx-arm64 --self-contained true -p:DebugType=none -o publish/mac-arm64
          mkdir -p dist
          bash deploy/macos/make-app.sh publish/mac-arm64 1.0.0 arm64 dist
          ls -la dist

      - name: Test (case-insensitive APFS)
        env:
          PAIRNETS_CONVERGENCE_SEEDS: 50
        run: >
          dotnet test tests/Pairnets.Tests/Pairnets.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=macos.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --blame-hang-timeout 10m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: TestResults
          if-no-files-found: ignore
