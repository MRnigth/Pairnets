name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  linux:
    name: Build and test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (tree and history)
        run: |
          bash scripts/check-secrets.sh --tree
          bash scripts/check-secrets.sh --history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tether.sln

      - name: Build (client included via EnableWindowsTargeting)
        run: dotnet build Tether.sln -c Release --no-restore

      - name: Test
        env:
          TETHER_CONVERGENCE_SEEDS: 250
        run: >
          dotnet test Tether.sln -c Release --no-build
          --logger "trx;LogFileName=linux.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --blame-hang-timeout 10m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore

  windows:
    name: Build client and test (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tether.sln

      - name: Build
        run: dotnet build Tether.sln -c Release --no-restore

      - name: Publish client (single-file smoke test)
        run: >
          dotnet publish src/Tether.Client/Tether.Client.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish/client

      - name: Test
        env:
          TETHER_CONVERGENCE_SEEDS: 50
        run: >
          dotnet test Tether.sln -c Release --no-build
          --logger "trx;LogFileName=windows.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --blame-hang-timeout 10m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults
          if-no-files-found: ignore
