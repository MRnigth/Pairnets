name: Release

# Tags (v*) and releases published on GitHub (Releases -> Draft a new release) get the packages
# attached. Every push to main also replaces the "latest" release ("Latest build"), so the newest
# packages always have fixed links: https://github.com/<owner>/<repo>/releases/download/latest/<file>
# Only a v* tag's release is ever GitHub's "Latest release" (releases/latest/download), which the apps,
# update.sh and get.sh update from: "Latest build" is a pre-release and never marked latest.
# A push to beta/public or beta/developer replaces the rolling pre-release public-beta or developer-beta: the beta
# feeds (docs/DECISIONS.md, "Beta channels"). Every version.json says which channel it is for; the apps only take a
# release whose channel is the feed they asked, so main's "Latest build" (channel main) is never installed.
on:
  push:
    tags: ["v*"]
    branches: [main, beta/public, beta/developer]
    # The Worker (cloud/) and the website (site/) deploy on their own; a change to only those is not an app update.
    paths-ignore: ["cloud/**", "site/**"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # One version, channel and build for every package and version.json of this run (scripts/release-version.sh):
  # a v* tag = its number (stable); beta/public, beta/developer = the newest v* tag plus one in its last part (so it
  # needs every tag: fetch-depth 0); anything else (main) = 1.0.<run number>, channel main.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        shell: bash
        run: |
          bash scripts/release-version.sh | tee -a "$GITHUB_OUTPUT"
          bash scripts/data-versions.sh

  server:
    name: Server (linux-x64)
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Chromium for the website tests
        run: |
          if [ -d tests/Pairnets.Browser.Tests ]; then
            dotnet build tests/Pairnets.Browser.Tests -c Release
            pwsh tests/Pairnets.Browser.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
          else
            echo "tests/Pairnets.Browser.Tests is not here yet"
          fi
      - name: Test
        run: dotnet test Pairnets.sln -c Release
      - name: Publish
        run: >
          dotnet publish src/Pairnets.Server/Pairnets.Server.csproj -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }} -p:PairnetsChannel=${{ needs.version.outputs.channel }}
          -p:PairnetsBuild=${{ needs.version.outputs.build }} -o dist/pairnets-server-linux-x64
      - name: Package
        # The same script makes the package for the pre-deploy check (scripts/pre-deploy.ps1).
        run: bash scripts/package-server.sh dist/pairnets-server-linux-x64 "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/pairnets-server-linux-x64.tar.gz

  client:
    name: Client (win-x64)
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test the Windows app
        shell: pwsh
        run: |
          if (Test-Path tests/Pairnets.Client.Tests) {
            dotnet test tests/Pairnets.Client.Tests -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "tests/Pairnets.Client.Tests is not here yet" }
      - name: Publish
        run: >
          dotnet publish src/Pairnets.Client/Pairnets.Client.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }} -p:PairnetsChannel=${{ needs.version.outputs.channel }}
          -p:PairnetsBuild=${{ needs.version.outputs.build }} -o publish/client
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item deploy/README-client.txt publish/client/
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/client/Pairnets.exe, publish/client/README-client.txt -DestinationPath dist/pairnets-client-win-x64.zip
      - name: Installer (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceDir=$PWD\publish\client" "/O$PWD\dist" deploy\installer\pairnets.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: dist/*

  desktop-linux:
    name: Desktop app (linux-x64)
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        run: >
          dotnet publish src/Pairnets.Desktop/Pairnets.Desktop.csproj -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ needs.version.outputs.version }} -p:PairnetsChannel=${{ needs.version.outputs.channel }}
          -p:PairnetsBuild=${{ needs.version.outputs.build }} -o dist/pairnets-desktop-linux-x64
      - name: Package
        run: |
          cp deploy/linux-desktop/install-desktop.sh dist/pairnets-desktop-linux-x64/
          cp assets/pairnets-icon-256.png dist/pairnets-desktop-linux-x64/pairnets.png
          chmod +x dist/pairnets-desktop-linux-x64/install-desktop.sh dist/pairnets-desktop-linux-x64/Pairnets
          tar -C dist -czf dist/pairnets-desktop-linux-x64.tar.gz pairnets-desktop-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/pairnets-desktop-linux-x64.tar.gz

  macos:
    name: Desktop app (macOS)
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish and bundle
        run: |
          mkdir -p dist
          for arch in arm64 x64; do
            dotnet publish src/Pairnets.Desktop/Pairnets.Desktop.csproj -c Release -r osx-$arch --self-contained true \
              -p:DebugType=none -p:Version=${{ needs.version.outputs.version }} -p:PairnetsChannel=${{ needs.version.outputs.channel }} \
              -p:PairnetsBuild=${{ needs.version.outputs.build }} -o publish/mac-$arch
            bash deploy/macos/make-app.sh publish/mac-$arch ${{ needs.version.outputs.version }} $arch dist
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  # The server package of this run, installed the real way under systemd before it is released (as in
  # ci.yml and the pre-deploy check, docs/PREDEPLOY.md). Phase A: install, the API tour and website
  # tests against it, the self-update. Phase B: the published release upgraded to this package.
  linux-install:
    name: Install on Linux (${{ matrix.check }})
    needs: [server]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [install-and-update, upgrade-from-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: dist
      - name: Update feeds from this run's package
        run: |
          v="$(tar -xOzf dist/pairnets-server-linux-x64.tar.gz pairnets-server-linux-x64/VERSION | tr -d '[:space:]')"
          bash scripts/make-feed.sh dist/pairnets-server-linux-x64.tar.gz "$v" dist/feed1 "$GITHUB_SHA"
          bash scripts/make-feed.sh dist/feed1/pairnets-server-linux-x64.tar.gz next dist/feed2 "$GITHUB_SHA"
      - name: Build (for the tests against the installed server)
        if: matrix.check == 'install-and-update'
        run: dotnet build Pairnets.sln -c Release
      - name: Install with get.sh (phase A)
        if: matrix.check == 'install-and-update'
        run: sudo bash tests/linux-server/install-check.sh --feed dist/feed1
      - name: Test-only nest settings (HTTPS, fake mail and Google)
        if: matrix.check == 'install-and-update'
        run: sudo bash tests/linux-server/test-nest-config.sh
      - name: Point the updater at feed 2
        if: matrix.check == 'install-and-update'
        run: sudo bash tests/linux-server/update-check.sh prepare --feed dist/feed2
      - name: Chromium for the website tests
        if: matrix.check == 'install-and-update'
        run: |
          if [ -d tests/Pairnets.Browser.Tests ]; then
            pwsh tests/Pairnets.Browser.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
          else
            echo "tests/Pairnets.Browser.Tests is not here yet"
          fi
      - name: API tour and website tests against the installed server
        if: matrix.check == 'install-and-update'
        env:
          PAIRNETS_E2E_TARGET: installed-linux
          PAIRNETS_E2E_URL: http://127.0.0.1:15075/
          PAIRNETS_E2E_WEBSITE_URL: https://localhost:15443/
          PAIRNETS_E2E_SHELL: sudo
          PAIRNETS_E2E_DATA_DIR: /var/lib/pairnets
          PAIRNETS_E2E_SERVICE: pairnets-server
          PAIRNETS_E2E_MAIL_DIR: /var/lib/pairnets-e2e/mail
          PAIRNETS_E2E_REPORT: ${{ runner.temp }}/tour-installed-linux.json
        run: |
          token="$(sudo sed -n 's/^SYNC_TOKEN=//p' /etc/pairnets/pairnets.env)"
          echo "::add-mask::$token"
          # The website tests first: they restart the server (which also resets its email limit), and the
          # tour ends with a real "Update server".
          if [ -d tests/Pairnets.Browser.Tests ]; then
            PAIRNETS_E2E_TOKEN="$token" dotnet test tests/Pairnets.Browser.Tests -c Release --no-build \
              --logger "trx;LogFilePrefix=installed-linux-website" --logger "console;verbosity=normal" \
              --results-directory TestResults --blame-hang-timeout 10m
          fi
          PAIRNETS_E2E_TOKEN="$token" dotnet test tests/Pairnets.Tests -c Release --no-build \
            --filter "FullyQualifiedName~InstalledLinux" \
            --logger "trx;LogFilePrefix=installed-linux-tour" --logger "console;verbosity=normal" \
            --results-directory TestResults --blame-hang-timeout 10m
          if [ ! -s "$PAIRNETS_E2E_REPORT" ]; then
            echo "::error::the installed-linux API tour did not run (it wrote no report)"
            exit 1
          fi
      - name: Update (after the tour)
        if: matrix.check == 'install-and-update'
        run: sudo bash tests/linux-server/update-check.sh verify
      - name: Upgrade from the published release (phase B)
        if: matrix.check == 'upgrade-from-release'
        run: sudo bash tests/linux-server/upgrade-check.sh --feed dist/feed1
      - name: Server logs
        # Only for a failed run: every artifact of a successful run becomes a release asset.
        if: failure()
        run: |
          mkdir -p TestResults
          { sudo journalctl --no-pager -o short-iso -u 'pairnets-*'; echo '--- update.log'; sudo cat /var/lib/pairnets/update/update.log; } > TestResults/server-journal.log 2>&1 || true
          token="$(sudo sed -n 's/^SYNC_TOKEN=//p' /etc/pairnets/pairnets.env 2>/dev/null || true)"
          if [ -n "$token" ]; then sed -i "s/$token/(token hidden)/g" TestResults/server-journal.log; fi
          if [ -f "${{ runner.temp }}/tour-installed-linux.json" ]; then cp "${{ runner.temp }}/tour-installed-linux.json" TestResults/; fi
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-install-${{ matrix.check }}
          path: TestResults
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, server, client, desktop-linux, macos, linux-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The packages go in their own folder: the checkout already has an assets/ folder (icons, fonts) that
      # must not end up among the release files.
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Server installer (pairnets.app/get.sh points at this copy, not at main)
        run: cp deploy/get.sh release-files/get.sh
      - name: Version file (read by the apps' update check)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          # The apps take a release only when its channel is the feed they asked for (never "main"), and when none of its
          # data versions (scripts/data-versions.sh) is lower than their own. SHA256SUMS.txt lists this file, so it is signed.
          data="$(bash scripts/data-versions.sh)"
          printf '{"version":"%s","commit":"%s","channel":"%s","build":%d,"data":%s}\n' "$VERSION" "$GITHUB_SHA" "$CHANNEL" "$BUILD" "$data" > release-files/version.json
          cat release-files/version.json
      - name: Checksums
        working-directory: release-files
        run: |
          # Every release file is a plain file; a folder here would also break the upload below.
          dirs="$(find . -mindepth 1 -maxdepth 1 ! -type f)"
          if [ -n "$dirs" ]; then echo "::error::not a plain file, cannot be a release file: $dirs"; exit 1; fi
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt*' -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign the checksums (the apps, update.sh and get.sh only install a signed release)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash scripts/sign-release.sh release-files
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # --latest: the apps and the server update from GitHub's "latest release" (releases/latest/download), so every
            # tagged version (v1.0.61, a quick fix like v1.0.59.1) becomes it. Only tags do: "Latest build" never is.
            gh release create "$GITHUB_REF_NAME" release-files/* --repo "$GITHUB_REPOSITORY" --title "Pairnets $GITHUB_REF_NAME" --generate-notes --latest
          fi

  latest:
    name: Latest build (main)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [version, server, client, desktop-linux, macos, linux-install]
    runs-on: ubuntu-latest
    concurrency:
      group: latest-build
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The packages go in their own folder: the checkout already has an assets/ folder (icons, fonts) that
      # must not end up among the release files.
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Server installer (pairnets.app/get.sh points at this copy, not at main)
        run: cp deploy/get.sh release-files/get.sh
      - name: Version file (read by the apps' update check)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          # The apps take a release only when its channel is the feed they asked for (never "main"), and when none of its
          # data versions (scripts/data-versions.sh) is lower than their own. SHA256SUMS.txt lists this file, so it is signed.
          data="$(bash scripts/data-versions.sh)"
          printf '{"version":"%s","commit":"%s","channel":"%s","build":%d,"data":%s}\n' "$VERSION" "$GITHUB_SHA" "$CHANNEL" "$BUILD" "$data" > release-files/version.json
          cat release-files/version.json
      - name: Checksums
        working-directory: release-files
        run: |
          # Every release file is a plain file; a folder here would also break the upload below.
          dirs="$(find . -mindepth 1 -maxdepth 1 ! -type f)"
          if [ -n "$dirs" ]; then echo "::error::not a plain file, cannot be a release file: $dirs"; exit 1; fi
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt*' -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign the checksums (the apps, update.sh and get.sh only install a signed release)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash scripts/sign-release.sh release-files
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never GitHub's "Latest release": a pre-release marked not latest, so releases/latest/download (what the apps,
          # update.sh and get.sh read) only ever serves a v* tag's version. Its own links use the tag name: download/latest/.
          # Its version.json says "channel":"main", which no app installs, also from a beta feed.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Latest build" \
            --notes "Built automatically from the newest commit on main (${GITHUB_SHA::7}).

          * Windows: PairnetsSetup.exe (installer) or pairnets-client-win-x64.zip (just Pairnets.exe)
          * Mac: Pairnets-macos-arm64.dmg (Apple silicon) or Pairnets-macos-x64.dmg (Intel)
          * Linux desktop: pairnets-desktop-linux-x64.tar.gz
          * Server: pairnets-server-linux-x64.tar.gz

          Check downloads against SHA256SUMS.txt. SHA256SUMS.txt.sig is its signature by the Pairnets release key
          (deploy/release-signing.pub): openssl dgst -sha256 -verify release-signing.pub -signature SHA256SUMS.txt.sig SHA256SUMS.txt"

  # The beta feeds: a push to beta/public or beta/developer replaces the rolling pre-release public-beta or
  # developer-beta (the tag is the channel). Same files, names and signing key as a release; never GitHub's latest.
  beta:
    name: Beta (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/heads/beta/') && github.event_name == 'push'
    needs: [version, server, client, desktop-linux, macos, linux-install]
    runs-on: ubuntu-latest
    concurrency:
      group: beta-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The packages go in their own folder: the checkout already has an assets/ folder (icons, fonts) that
      # must not end up among the release files.
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Server installer (pairnets.app/get.sh points at this copy, not at main)
        run: cp deploy/get.sh release-files/get.sh
      - name: Version file (read by the apps' update check)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          # The apps take a release only when its channel is the feed they asked for (never "main"), and when none of its
          # data versions (scripts/data-versions.sh) is lower than their own. SHA256SUMS.txt lists this file, so it is signed.
          data="$(bash scripts/data-versions.sh)"
          printf '{"version":"%s","commit":"%s","channel":"%s","build":%d,"data":%s}\n' "$VERSION" "$GITHUB_SHA" "$CHANNEL" "$BUILD" "$data" > release-files/version.json
          cat release-files/version.json
      - name: Checksums
        working-directory: release-files
        run: |
          # Every release file is a plain file; a folder here would also break the upload below.
          dirs="$(find . -mindepth 1 -maxdepth 1 ! -type f)"
          if [ -n "$dirs" ]; then echo "::error::not a plain file, cannot be a release file: $dirs"; exit 1; fi
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt*' -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign the checksums (the apps, update.sh and get.sh only install a signed release)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash scripts/sign-release.sh release-files
      - name: Replace the beta release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          case "$CHANNEL" in
            public-beta) title="Public beta $VERSION (build $BUILD)"; who="computers on Public beta" ;;
            developer-beta) title="Developer beta $VERSION (build $BUILD)"; who="computers on Developer beta" ;;
            *) echo "::error::not a beta channel: $CHANNEL"; exit 1 ;;
          esac
          # Never GitHub's "Latest release": --prerelease --latest=false, like "Latest build". The tag is the channel.
          gh release delete "$CHANNEL" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$CHANNEL" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$title" \
            --notes "$title, built automatically from the newest commit on $GITHUB_REF_NAME (${GITHUB_SHA::7}). Pairnets on
          $who updates to it by itself; it is a test version, not a finished one.

          Check downloads against SHA256SUMS.txt. SHA256SUMS.txt.sig is its signature by the Pairnets release key
          (deploy/release-signing.pub): openssl dgst -sha256 -verify release-signing.pub -signature SHA256SUMS.txt.sig SHA256SUMS.txt"
