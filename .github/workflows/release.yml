name: Release

# Tags (v*) and releases published on GitHub (Releases -> Draft a new release) get the packages
# attached. Every push to main also replaces the "latest" release ("Latest build"), so the newest
# packages always have fixed links: https://github.com/<owner>/<repo>/releases/download/latest/<file>
on:
  push:
    tags: ["v*"]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  server:
    name: Server (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi
      - name: Test
        run: dotnet test Tether.sln -c Release
      - name: Publish
        run: >
          dotnet publish src/Tether.Server/Tether.Server.csproj -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=none
          -p:Version=${{ steps.v.outputs.version }} -o dist/tether-server-linux-x64
      - name: Package
        run: |
          cp deploy/install.sh deploy/update.sh deploy/tether-server.service deploy/tether-update.service deploy/tether-update.path \
             deploy/tether.env.example deploy/tailscale-acl.hujson dist/tether-server-linux-x64/
          echo "${{ steps.v.outputs.version }}" > dist/tether-server-linux-x64/VERSION
          cp docs/DEPLOY.md dist/tether-server-linux-x64/DEPLOY.md
          chmod +x dist/tether-server-linux-x64/install.sh dist/tether-server-linux-x64/update.sh dist/tether-server-linux-x64/tether-server
          tar -C dist -czf dist/tether-server-linux-x64.tar.gz tether-server-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/tether-server-linux-x64.tar.gz

  client:
    name: Client (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi
      - name: Publish
        run: >
          dotnet publish src/Tether.Client/Tether.Client.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.v.outputs.version }} -o publish/client
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item deploy/README-client.txt publish/client/
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/client/Tether.exe, publish/client/README-client.txt -DestinationPath dist/tether-client-win-x64.zip
      - name: Installer (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceDir=$PWD\publish\client" "/O$PWD\dist" deploy\installer\tether.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: dist/*

  desktop-linux:
    name: Desktop app (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi
      - name: Publish
        run: >
          dotnet publish src/Tether.Desktop/Tether.Desktop.csproj -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.v.outputs.version }} -o dist/tether-desktop-linux-x64
      - name: Package
        run: |
          cp deploy/linux-desktop/install-desktop.sh dist/tether-desktop-linux-x64/
          cp assets/tether-icon-256.png dist/tether-desktop-linux-x64/tether.png
          chmod +x dist/tether-desktop-linux-x64/install-desktop.sh dist/tether-desktop-linux-x64/Tether
          tar -C dist -czf dist/tether-desktop-linux-x64.tar.gz tether-desktop-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/tether-desktop-linux-x64.tar.gz

  macos:
    name: Desktop app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi
      - name: Publish and bundle
        run: |
          mkdir -p dist
          for arch in arm64 x64; do
            dotnet publish src/Tether.Desktop/Tether.Desktop.csproj -c Release -r osx-$arch --self-contained true \
              -p:DebugType=none -p:Version=${{ steps.v.outputs.version }} -o publish/mac-$arch
            bash deploy/macos/make-app.sh publish/mac-$arch ${{ steps.v.outputs.version }} $arch dist
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, client, desktop-linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "Tether $GITHUB_REF_NAME" --generate-notes
          fi

  latest:
    name: Latest build (main)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, client, desktop-linux, macos]
    runs-on: ubuntu-latest
    concurrency:
      group: latest-build
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Built automatically from the newest commit on main (${GITHUB_SHA::7}).

          * Windows: TetherSetup.exe (installer) or tether-client-win-x64.zip (just Tether.exe)
          * Mac: Tether-macos-arm64.dmg (Apple silicon) or Tether-macos-x64.dmg (Intel)
          * Linux desktop: tether-desktop-linux-x64.tar.gz
          * Server: tether-server-linux-x64.tar.gz

          Check downloads against SHA256SUMS.txt."
