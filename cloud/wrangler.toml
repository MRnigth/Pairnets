# Pairnets Cloud: accounts, pages and the relay to people's own servers (cloud/CONTRACT.md, cloud/RELAY.md).
#
# This file holds no keys and no ids. Every private value, and the account-specific ones, live only in Cloudflare's
# secret store (listed at the bottom; `node scripts/setup-secrets.mjs` sets them). The database is found by its name:
# the first `npx wrangler deploy` creates it, later ones reuse it. Deploy the router (cloud/router) first. The tests
# never read this file's secrets: they generate every key while they run.

name = "pairnets-sync"
main = "src/index.ts"
compatibility_date = "2026-08-15"
workers_dev = false

# A custom domain on the pairnets.app zone: the deploy makes its DNS record and certificate.
routes = [{ pattern = "sync.pairnets.app", custom_domain = true }]

[vars]
PUBLIC_ORIGIN = "https://sync.pairnets.app"
MAIL_FROM = "Pairnets <signin@pairnets.app>"
MAIL_REPLY_TO = "Pairnets Support <support@pairnets.app>"
# Cloudflare Email Service sends first, from the mail.pairnets.app subdomain; Resend (MAIL_FROM) is the fallback.
MAIL_FROM_CF = "Pairnets <signin@mail.pairnets.app>"
EMAIL_DAILY_LIMIT = "80"
# Relayed servers in all. Cloudflare allows 1,000 tunnels per account; stay well under it.
MAX_NESTS = "900"
# Nests one account may have, both kinds together (the owner's choice); a removed one frees its place at once.
MAX_NESTS_PER_ACCOUNT = "3"
# "1" = emergency switch: /nest-login refuses and heartbeats answer disableHostedLogin: true.
HOSTED_LOGIN_DISABLED = "0"
# Optional test seams (Google's real URLs are the defaults when these are not set):
# GOOGLE_AUTH_URL = "https://accounts.google.com/o/oauth2/v2/auth"
# GOOGLE_TOKEN_URL = "https://oauth2.googleapis.com/token"
# GOOGLE_JWKS_URL = "https://www.googleapis.com/oauth2/v3/certs"
# CF_API_URL = "http://127.0.0.1:8790/client/v4"   # local end-to-end runs only: a stand-in Cloudflare API

# Cloudflare Email Service (outbound). mail.pairnets.app and news.pairnets.app are set up as sending domains.
[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "pairnets-sync"
migrations_dir = "migrations"

# The router Worker (cloud/router): it holds one Workers VPC link per relayed server and has no route of its own.
[[services]]
binding = "ROUTER"
service = "pairnets-router"

# The relay's limits (src/relay.ts; a test checks each matches its constant), counted by Cloudflare next to the Worker,
# so a relayed request costs no database write. RELAY_LIMIT: the flood ceiling per address (RELAY_PER_MINUTE).
# RELAY_DEVICE_LIMIT: each computer's own budget at its server (RELAY_DEVICE_PER_MINUTE). RELAY_FAIL_LIMIT: keyless and
# failing requests per address (RELAY_IP_PER_MINUTE). RELAY_NEST_LIMIT: everything relayed to one server from all its
# computers together (RELAY_NEST_PER_MINUTE); five computers at their full budget fit under it, so it only stops one
# server from taking the whole plan. namespace_id is not an id of the account or a key: it is a number
# chosen here, which only has to differ from other rate limiters on the account (limiters with the same number share
# their counts). period may only be 10 or 60. Nothing to create by hand: the deploy sets them up.
[[ratelimits]]
name = "RELAY_LIMIT"
namespace_id = "1001"
simple = { limit = 20000, period = 60 }

[[ratelimits]]
name = "RELAY_DEVICE_LIMIT"
namespace_id = "1002"
simple = { limit = 6000, period = 60 }

[[ratelimits]]
name = "RELAY_FAIL_LIMIT"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RELAY_NEST_LIMIT"
namespace_id = "1004"
simple = { limit = 30000, period = 60 }

[triggers]
# Hourly: expired rows, the 90-day audit, servers that never connected, accounts unused for a year (warned 30 days
# before), and the router deploy and tunnel cleanup (src/cron.ts).
crons = ["17 * * * *"]

# Secrets: set them in the Cloudflare dashboard (Workers > pairnets-sync > Settings > Variables and Secrets) or with
# `npx wrangler secret put NAME`. Locally they go in cloud/.dev.vars, which git ignores. Never put them in this file.
#
#   SIGNING_KEY           private ES256 JWK with "kid" ({"kty":"EC","crv":"P-256","x":..,"y":..,"d":..,"kid":..});
#                         make it with `npm run keygen` (the public half goes into src/Pairnets.Server/Auth/HostedKeys.cs)
#   HB_MASTER             base64url of 32 random bytes (derives each nest's key); `npm run keygen -- --random`
#   COOKIE_KEY            base64url of 32 random bytes (signs the Google flow cookie, keys the rate-limit buckets)
#   GOOGLE_CLIENT_SECRET  from the Google Cloud OAuth client (redirect URI https://sync.pairnets.app/login/google/callback)
#   TURNSTILE_SECRET      from the Cloudflare Turnstile widget for sync.pairnets.app
#   RESEND_API_KEY        from Resend (sending domain pairnets.app verified there)
#   CF_API_TOKEN          a Cloudflare API token for this account with exactly: Account > Cloudflare Tunnel > Edit,
#                         Account > Workers Scripts > Edit, and the Connectivity Directory permission that binding
#                         VPC networks needs. It never leaves this Worker.
#   CF_ACCOUNT_ID         the Cloudflare account that owns the tunnels and the pairnets-router Worker
#
# Not private, but kept out of the code all the same (set the same way):
#
#   GOOGLE_CLIENT_ID      the Google OAuth client id (...apps.googleusercontent.com)
#   TURNSTILE_SITE_KEY    the Turnstile widget's site key
